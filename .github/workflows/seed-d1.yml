name: Seed D1 Articles

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'English SQL file in scripts/daily/, e.g. nov-12-2026-thread.sql (French files go in "Seed D1 Articles (French)")'
        required: true
      allow_future:
        description: 'Tick only to schedule an article with a future published_at (it leads the front page once its time arrives)'
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fails fast, before D1 is touched, on the mistakes that have caused
      # trouble: a French file in this workflow, a missing file, a slug date
      # that disagrees with published_at, or a published_at in the future.
      - name: Pre-flight check
        env:
          SQL_FILE: ${{ github.event.inputs.sql_file }}
          ALLOW_FUTURE: ${{ github.event.inputs.allow_future }}
        run: node scripts/validate-seed.js en "$SQL_FILE" $( [ "$ALLOW_FUTURE" = "true" ] && echo --allow-future )

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Execute SQL against D1
        run: wrangler d1 execute hdq-articles --file="scripts/daily/$SQL_FILE" --remote
        env:
          SQL_FILE: ${{ github.event.inputs.sql_file }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify IndexNow
        env:
          SQL_FILE: ${{ github.event.inputs.sql_file }}
        run: node scripts/indexnow-notify.js "scripts/daily/$SQL_FILE"

  extract:
    needs: seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-html-parser

      - name: Run chart extractor
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SOURCE_FILE: ${{ github.event.inputs.sql_file }}
        run: node scripts/extract-charts.js
