name: Upload approved HDQ heroes

on:
  push:
    branches: [hdq-hero-uploads]
    paths: ['approved-heroes/*.jpg.b64', '.github/workflows/approved-hero-upload.yml']

permissions:
  contents: read

concurrency:
  group: hdq-approved-heroes
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: |
          npm install --global wrangler
          if ! command -v identify >/dev/null; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
      - name: Upload approved JPEGs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          shopt -s nullglob
          image=$(mktemp)
          live=$(mktemp)
          trap 'rm -f "$image" "$live"' EXIT
          for source in approved-heroes/*.jpg.b64; do
            name=${source##*/}
            name=${name%.b64}
            if [[ ! "$name" =~ ^(behaviour|tax|economy|geo|market|thread|weekend)-[0-9]+\.jpg$ ]]; then
              echo "Unexpected filename: $name" >&2
              exit 1
            fi
            base64 --decode "$source" > "$image"
            if [[ "$(identify -quiet -format '%m %wx%h' "$image")" != 'JPEG 1200x650' ]]; then
              echo "Invalid JPEG dimensions or format: $name" >&2
              exit 1
            fi
            url="https://assets.hdq.ca/$name"
            status=$(curl -sS -o "$live" -w '%{http_code} %{content_type}' "$url?check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
            if [[ "$status" == '200 image/jpeg' ]]; then
              if cmp -s "$image" "$live"; then
                echo "Already live: $url"
                continue
              fi
              echo "A different image is already live: $url" >&2
              exit 1
            fi
            if [[ "$status" != 404\ * ]]; then
              echo "Unexpected HTTP status $status at $url" >&2
              exit 1
            fi
            if wrangler r2 object get "hdq-assets/$name" --file="$live" --remote; then
              if ! cmp -s "$image" "$live"; then
                echo "A different object is already stored: $name" >&2
                exit 1
              fi
            else
              wrangler r2 object put "hdq-assets/$name" --file="$image" --content-type=image/jpeg --remote
            fi
            wrangler r2 object get "hdq-assets/$name" --file="$live" --remote
            cmp "$image" "$live"
            echo "Verified exact bytes in R2: $name"
            for attempt in {1..6}; do
              status=$(curl -sS -o "$live" -w '%{http_code} %{content_type}' "$url?check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt")
              if [[ "$status" == '200 image/jpeg' ]] && cmp -s "$image" "$live"; then
                break
              fi
              sleep 5
            done
            if [[ "$status" != '200 image/jpeg' ]] || ! cmp -s "$image" "$live"; then
              echo "Could not verify the approved JPEG at $url (response: $status)" >&2
              exit 1
            fi
            echo "Verified: $url"
          done
