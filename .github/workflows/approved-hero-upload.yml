name: Upload approved HDQ heroes

on:
  push:
    branches: [hdq-hero-uploads]
    paths: ['approved-heroes/*.jpg.b64', '.github/workflows/approved-hero-upload.yml']

permissions:
  contents: read

concurrency:
  group: hdq-approved-heroes
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler and JPEG validator
        run: |
          npm install --global wrangler
          npm install --prefix "$RUNNER_TEMP/hdq-image-check" --no-audit --no-fund sharp@0.35.5
      - name: Upload approved JPEGs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          shopt -s nullglob
          image=$(mktemp)
          live=$(mktemp)
          trap 'rm -f "$image" "$live"' EXIT
          for source in approved-heroes/*.jpg.b64; do
            name=${source##*/}
            name=${name%.b64}
            if [[ ! "$name" =~ ^(behaviour|tax|economy|geo|market|thread|weekend)-[0-9]+\.jpg$ && ! "$name" =~ ^month-(january|february|march|april|may|june|july|august|september|october|november|december)-[0-9]{4}\.jpg$ ]]; then
              echo "Unexpected filename: $name" >&2
              exit 1
            fi
            base64 --decode "$source" > "$image"
            node - "$RUNNER_TEMP/hdq-image-check/node_modules/sharp" "$image" "$name" <<'NODE'
          const [sharpPath, path, name] = process.argv.slice(2);
          const image = require(sharpPath)(path, { failOn: "warning", limitInputPixels: 1200 * 650 });
          async function validate() {
            const { format, width, height } = await image.metadata();
            if (format !== "jpeg" || width !== 1200 || height !== 650) {
              throw new Error("expected a 1200x650 JPEG");
            }
            await image.raw().toBuffer();
          }
          validate().catch(error => {
            console.error(`Invalid approved JPEG ${name}: ${error.message}`);
            process.exitCode = 1;
          });
          NODE
            url="https://assets.hdq.ca/$name"
            status=$(curl -sS -o "$live" -w '%{http_code} %{content_type}' "$url?check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
            if [[ "$status" == '200 image/jpeg' ]]; then
              if cmp -s "$image" "$live"; then
                echo "Already live: $url"
                continue
              fi
              echo "A different image is already live: $url" >&2
              exit 1
            fi
            if [[ "$status" != 404\ * ]]; then
              echo "Unexpected HTTP status $status at $url" >&2
              exit 1
            fi
            if wrangler r2 object get "hdq-assets/$name" --file="$live" --remote; then
              if ! cmp -s "$image" "$live"; then
                echo "A different object is already stored: $name" >&2
                exit 1
              fi
            else
              wrangler r2 object put "hdq-assets/$name" --file="$image" --content-type=image/jpeg --remote
            fi
            wrangler r2 object get "hdq-assets/$name" --file="$live" --remote
            cmp "$image" "$live"
            echo "Verified exact bytes in R2: $name"
            for attempt in {1..6}; do
              status=$(curl -sS -o "$live" -w '%{http_code} %{content_type}' "$url?check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt")
              if [[ "$status" == '200 image/jpeg' ]] && cmp -s "$image" "$live"; then
                break
              fi
              sleep 5
            done
            if [[ "$status" != '200 image/jpeg' ]] || ! cmp -s "$image" "$live"; then
              echo "Could not verify the approved JPEG at $url (response: $status)" >&2
              exit 1
            fi
            echo "Verified: $url"
          done
