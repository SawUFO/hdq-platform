name: Extract Charts from Articles

on:
  workflow_dispatch:
    inputs:
      source_file:
        description: 'SQL filename to extract from (leave blank to extract all articles)'
        required: false
        default: ''

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-html-parser

      - name: Run chart extractor
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          SOURCE_FILE: ${{ inputs.source_file }}
        run: node scripts/extract-charts.js
