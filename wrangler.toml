name = "hdq-platform"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ───────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "hdq-articles"
database_id = "ca05159d-cb5a-406b-b1a9-4ca984df4d9c"

# ── D1 Database (French edition) ──────────────────────────────────────────────
[[d1_databases]]
binding = "DB_FR"
database_name = "hdq-articles-fr"
database_id = "026e3b25-32fc-4a5f-bdea-44eebb8470e1"

# ── Static assets ─────────────────────────────────────────────────────────────
[assets]
directory = "./static"
binding = "ASSETS"

# ── Workers Logs ──────────────────────────────────────────────────────────────
# Declared here rather than set in the dashboard, because every deploy runs
# through GitHub Actions from this file. A dashboard-only setting would be
# reset on the next push.
# head_sampling_rate = 1 logs 100% of requests, which is correct at HDQ's
# traffic volume. Lower it only if request counts ever make cost a factor.
[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
